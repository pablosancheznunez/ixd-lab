name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check against new releases of R, shiny and bslib.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Smoke tests (files, parsing, formulas)
        run: Rscript tests/smoke.R
